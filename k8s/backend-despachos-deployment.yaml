apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
  namespace: despachos
  labels:
    app: backend-despachos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
    spec:
      containers:
        - name: backend-despachos
          image: 210011303411.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:despachos-latest
          # OJO: confirma el server.port real en application.properties.
          # El Dockerfile declara EXPOSE 8081 pero el docker-compose mapea a 8080.
          # Si tu app en verdad escucha en 8081, cambia containerPort aqui
          # Y targetPort en backend-despachos-service.yaml a 8081.
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.despachos.svc.cluster.local:3306/tienda_perritos?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true"
            - name: DB_ENDPOINT
              value: "mysql.despachos.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
