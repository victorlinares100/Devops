apiVersion: apps/v1
kind: Deployment
metadata:
  name: despachos-db
  namespace: despachos
  labels:
    app: despachos-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: despachos-db
  template:
    metadata:
      labels:
        app: despachos-db
    spec:
      containers:
        - name: db
          image: 210011303411.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
