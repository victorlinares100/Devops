name: CI/CD Tienda Despachos - Backend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Configurar credenciales AWS desde GitHub Secrets
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build de ambas imágenes backend y push a ECR
      - name: Build y Push - Backend Ventas
        run: |
          cd backend/back-Ventas_SpringBoot
          docker build -t tienda-backend-ventas .
          docker tag tienda-backend-ventas:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest

      - name: Build y Push - Backend Despachos
        run: |
          cd backend/back-Despachos_SpringBoot
          docker build -t tienda-backend-despachos .
          docker tag tienda-backend-despachos:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest

      # 5. Instalar kubectl
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      # 6. Configurar kubeconfig para el clúster EKS
      - name: Configurar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl config current-context

      # 7. Aplicar namespace (idempotente, no falla si ya existe)
      - name: Aplicar namespace
        run: kubectl apply -f k8s/namespace.yaml

      # 8. Desplegar ambos backends en EKS
      - name: Desplegar Backend Ventas en EKS
        run: |
          kubectl apply -f k8s/backend-ventas-deployment.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl apply -f k8s/backend-ventas-service.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl set image deployment/backend-ventas \
            backend-ventas=${{ secrets.ECR_REPO_URL_BACKEND }}:ventas-latest \
            -n ${{ secrets.EKS_NAMESPACE }}
          kubectl rollout status deployment/backend-ventas -n ${{ secrets.EKS_NAMESPACE }}

      - name: Desplegar Backend Despachos en EKS
        run: |
          kubectl apply -f k8s/backend-despachos-deployment.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl apply -f k8s/backend-despachos-service.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl set image deployment/backend-despachos \
            backend-despachos=${{ secrets.ECR_REPO_URL_BACKEND }}:despachos-latest \
            -n ${{ secrets.EKS_NAMESPACE }}
          kubectl rollout status deployment/backend-despachos -n ${{ secrets.EKS_NAMESPACE }}
