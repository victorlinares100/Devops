name: CI/CD Tienda Despachos - DB

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Configurar credenciales AWS desde GitHub Secrets
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build de la imagen DB y push a ECR
      - name: Build imagen DB y Push a ECR
        run: |
          cd db
          docker build -t tienda-db .
          docker tag tienda-db:latest ${{ secrets.ECR_REPO_URL_DB }}:latest
          docker push ${{ secrets.ECR_REPO_URL_DB }}:latest

      # 5. Instalar kubectl
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      # 6. Configurar kubeconfig para el clúster EKS
      - name: Configurar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl config current-context

      # 7. Aplicar namespace (idempotente)
      - name: Aplicar namespace
        run: kubectl apply -f k8s/namespace.yaml

      # 8. Desplegar MySQL en EKS
      - name: Desplegar DB en EKS
        run: |
          kubectl apply -f k8s/mysql-secret.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl apply -f k8s/mysql-deployment.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl apply -f k8s/mysql-service.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl set image deployment/despachos-db \
            db=${{ secrets.ECR_REPO_URL_DB }}:latest \
            -n ${{ secrets.EKS_NAMESPACE }}
          kubectl rollout status deployment/despachos-db -n ${{ secrets.EKS_NAMESPACE }}
