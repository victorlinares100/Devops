name: CI/CD Tienda Despachos - Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Configurar credenciales AWS desde GitHub Secrets
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECRr
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build de la imagen frontend y push a ECR
      - name: Build imagen Frontend y Push a ECR
        run: |
          cd frontend
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t tienda-frontend .
          docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      # 5. Instalar kubectl
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      # 6. Configurar kubeconfig para el clúster EKS
      - name: Configurar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl config current-context

      # 7. Aplicar namespace (idempotente)
      - name: Aplicar namespace
        run: kubectl apply -f k8s/namespace.yaml

      # 8. Desplegar Frontend en EKS
      - name: Desplegar Frontend en EKS
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl apply -f k8s/frontend-service.yaml -n ${{ secrets.EKS_NAMESPACE }}
          kubectl set image deployment/frontend \
            frontend=${{ secrets.ECR_REPO_URL_FRONTEND }}:latest \
            -n ${{ secrets.EKS_NAMESPACE }}
          kubectl rollout status deployment/frontend -n ${{ secrets.EKS_NAMESPACE }}

      # 9. Ver la URL del LoadBalancer
      - name: Obtener URL de la app
        run: |
          kubectl get svc frontend -n ${{ secrets.EKS_NAMESPACE }}
